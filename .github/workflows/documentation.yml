name: Build and security checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-ci-password
          MARIADB_DATABASE: chat_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DATABASE_URL: mysql://root:synthetic-ci-password@127.0.0.1:3306/chat_test
      TEST_DATABASE_URL: mysql://root:synthetic-ci-password@127.0.0.1:3306/chat_test
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: python3 scripts/check_repository.py
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
